{% extends "base.html" %}

{% block title %}登录 - LAN Doc Hub{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h2>LAN Doc Hub</h2>
        <p class="login-sub">请使用您的账号登录</p>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="输入用户名" maxlength="32" required autofocus
                       value="{{ username|default('', true) }}">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="输入密码" maxlength="20" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">登录</button>
        </form>
    </div>
</div>
{% endblock %}

{% block head %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
    }
    .login-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .login-card h2 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 4px;
        text-align: center;
    }
    .login-sub {
        color: #6b7280;
        font-size: 0.85rem;
        margin-bottom: 24px;
        text-align: center;
    }
    .btn-block {
        display: block;
        width: 100%;
    }
</style>
{% endblock %}
