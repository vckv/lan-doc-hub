{# 跨项目上传拦截模态框（F2-2） #}
{# 备用服务器端渲染方案；主方案由 upload_intercept_modal.js 动态注入 #}
<div class="modal fade" id="uploadInterceptModal" tabindex="-1" role="dialog"
     aria-labelledby="interceptModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="interceptModalTitle">&#9888; 跨项目上传提示</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="关闭">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p id="interceptMessage"></p>
                <p class="text-muted small">请选择文件的存放方式：</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">
                    取消
                </button>
                <button type="button" class="btn btn-warning" id="btnSaveToCorrect">
                    &#128193; 保存到正确项目文件夹
                </button>
                <button type="button" class="btn btn-info" id="btnSaveWithShortcut">
                    &#128193; 保存到正确项目，并在此创建快捷方式
                </button>
            </div>
        </div>
    </div>
</div>
